# ─────────────────────────────────────────────────────────────────────────────
# Nginx: web server for the React app + load balancer for the API
#
#   browser ──► Nginx :80 ──┬──► api replica 1 :5000
#                           ├──► api replica 2 :5000   (round-robin)
#                           └──► api replica 3 :5000
# ─────────────────────────────────────────────────────────────────────────────

# Docker's DNS returns one address per "api" replica; Nginx spreads
# requests over all of them
upstream api_servers {
    # least_conn;              # uncomment: send to the least busy server instead of round-robin
    server api:5000 max_fails=3 fail_timeout=10s;   # passive health check
    keepalive 32;              # reuse connections to the API servers
}

# Extra protection for the login endpoints at the edge (5 per second per IP)
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    # Clearance requests carry up to 20 files of 5 MB
    client_max_body_size 110m;

    # Compress text responses (HTML, JS, CSS, JSON)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # The React single-page app
    root /usr/share/nginx/html;
    location / {
        try_files $uri /index.html;
    }
    location /assets/ {
        expires 30d;                       # file names change on every build
        add_header Cache-Control "public, immutable";
    }

    # Common proxy settings for the API
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    # If a server is down, try the next one (POSTs are never sent twice)
    proxy_next_upstream error timeout http_502 http_503;

    location /api/auth/ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://api_servers;
    }

    # Live updates: keep the stream open and pass every event straight through
    location /api/events {
        proxy_pass http://api_servers;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://api_servers;
        proxy_read_timeout 60s;
    }
}

# HTTPS (secure client/server communication): get a certificate (e.g. with
# Let's Encrypt / certbot), then add a server block like this and redirect
